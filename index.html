<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5a3d">
    <meta name="description" content="Conecta Bueno - Mapa Cultural de Bueno Brandão, MG. Descubra espaços culturais, cachoeiras e pontos turísticos da Serra da Mantiqueira.">
    <title>Conecta Bueno - Mapa Cultural de Bueno Brandão, MG</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Carregando mapa...</p>
    </div>

    <!-- Header -->
    <header class="map-header">
        <div class="header-left">
            <button class="btn-menu" id="btnToggleMenu">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M3 12H21M3 6H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
            <div class="header-brand">
                <h1>Conecta Bueno</h1>
                <span class="header-location">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                        <path d="M7 0C4.2 0 2 2.2 2 5c0 3.9 5 9 5 9s5-5.1 5-9c0-2.8-2.2-5-5-5zm0 7c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    </svg>
                    Bueno Brandão, MG
                </span>
            </div>
        </div>
        <div class="header-right">
            <button class="btn-icon" id="btnNotifications" title="Notificações">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M10 2C7.5 2 5.5 4 5.5 6.5V10L3.5 12V13H16.5V12L14.5 10V6.5C14.5 4 12.5 2 10 2Z" stroke="currentColor" stroke-width="1.5"/>
                    <path d="M8.5 13V14C8.5 15.1 9.4 16 10.5 16C11.6 16 12.5 15.1 12.5 14V13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                <span class="notification-badge">3</span>
            </button>
            <div class="user-menu">
                <button class="user-avatar" id="btnUserMenu">
                    <span id="userInitials">?</span>
                </button>
                <div class="user-dropdown" id="userDropdown">
                    <div class="user-info">
                        <div class="user-avatar-large">
                            <span id="userInitialsLarge">?</span>
                        </div>
                        <div class="user-details">
                            <strong id="userName">Carregando...</strong>
                            <span id="userEmail">...</span>
                        </div>
                    </div>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" id="btnProfile">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M3 15C3 12.2 5.7 10 9 10C12.3 10 15 12.2 15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <span>Meu Perfil</span>
                    </a>
                    <a href="pages/panel.html" class="dropdown-item" id="btnAdminPanel">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <rect x="3" y="3" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="10" y="3" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="3" y="10" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
                            <rect x="10" y="10" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                        <span>Painel Admin</span>
                    </a>
                    <a href="#" class="dropdown-item" id="btnSettings">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M9 2V4M9 14V16M16 9H14M4 9H2M14.5 3.5L13 5M5 13L3.5 14.5M14.5 14.5L13 13M5 5L3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <span>Configurações</span>
                    </a>
                    <div class="dropdown-divider"></div>
                    <a href="#" class="dropdown-item" id="btnLogout">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M7 16H4C3.4 16 3 15.6 3 15V3C3 2.4 3.4 2 4 2H7M11 13L15 9L11 5M15 9H7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <span>Sair</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Container Principal -->
    <div class="map-wrapper">
        <!-- Sidebar -->
        <aside class="map-sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Explorar Bueno Brandão</h2>
            </div>

            <!-- Busca -->
            <div class="search-section">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="search-input" 
                        placeholder="Buscar lugares..."
                        autocomplete="off"
                    >
                    <button class="search-clear" id="btnClearSearch" style="display: none;">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Filtros -->
            <div class="filters-section">
                <div class="filters-header">
                    <h3>Categorias</h3>
                    <button class="btn-clear-filters" id="btnClearFilters">
                        Limpar
                    </button>
                </div>
                <div class="filter-buttons" id="filterButtons">
                    <button class="filter-btn active" data-category="todas">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M9 5V9L12 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <span>Todas</span>
                    </button>
                    <!-- Categorias dinâmicas serão carregadas aqui -->
                </div>
            </div>

            <!-- Contador -->
            <div class="results-info">
                <div class="results-count" id="resultsCount">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 0C5.2 0 3 2.2 3 5c0 3.9 5 11 5 11s5-7.1 5-11c0-2.8-2.2-5-5-5zm0 7.5c-1.4 0-2.5-1.1-2.5-2.5S6.6 2.5 8 2.5s2.5 1.1 2.5 2.5S9.4 7.5 8 7.5z"/>
                    </svg>
                    <span>Carregando...</span>
                </div>
            </div>

            <!-- Lista de Espaços -->
            <div class="spaces-section">
                <div class="spaces-header">
                    <h3>Lugares</h3>
                    <select class="sort-select" id="sortSelect">
                        <option value="nome">Nome A-Z</option>
                        <option value="distancia">Mais Próximos</option>
                        <option value="popular">Mais Populares</option>
                    </select>
                </div>
                <div class="spaces-list" id="spacesList">
                    <div class="loading-state">
                        <div class="skeleton-loader"></div>
                        <div class="skeleton-loader"></div>
                        <div class="skeleton-loader"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Mapa -->
        <div class="map-container">
            <div id="map"></div>
            
            <!-- Map Controls -->
            <div class="map-controls">
                <button class="map-control-btn" id="btnMyLocation" title="Minha localização">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 2V5M10 15V18M18 10H15M5 10H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="map-control-btn" id="btnRecenter" title="Recentrar mapa">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 3C6.1 3 3 6.1 3 10C3 13.9 6.1 17 10 17C13.9 17 17 13.9 17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M17 6V10H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- Map Legend -->
            <div class="map-legend" id="mapLegend">
                <button class="legend-toggle" id="btnToggleLegend">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <rect x="2" y="3" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M6 7H12M6 11H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Legenda</span>
                </button>
                <div class="legend-content" style="display: none;">
                    <!-- Será preenchido dinamicamente -->
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Config Firebase -->
    <script src="js/firebase-config.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Script do Mapa -->
    <script src="js/map.js"></script>
</body>
</html>
