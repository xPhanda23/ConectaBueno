<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2d5a3d">
    <meta name="description" content="Conecta Bueno - Mapa Cultural de Bueno Brandão, MG. Descubra espaços culturais, cachoeiras e pontos turísticos da Serra da Mantiqueira.">
    <title>Conecta Bueno - Mapa Cultural de Bueno Brandão, MG</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/shared-components.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Carregando mapa...</p>
    </div>

    <header class="site-header" id="siteHeader">
        <div class="hd-inner">
            <a href="pages/home.html" class="hd-brand" aria-label="Conecta Bueno — página inicial">
                <span class="hd-brand-seals">
                    <img src="assets/images/bueno.png" alt="Prefeitura de Bueno Brandão" class="hd-brand-seal">
                    <img src="assets/images/logo.png" alt="Conecta Bueno" class="hd-brand-seal hd-brand-seal--front">
                </span>
                <span class="hd-brand-name">Conecta Bueno</span>
            </a>

            <nav class="hd-nav" aria-label="Navegação principal">
                <a href="pages/home.html" class="hd-nav-link">Início</a>
                <a href="index.html" class="hd-nav-link hd-nav-active">Mapa</a>
                <a href="pages/eventos.html" class="hd-nav-link">Eventos</a>
                <a href="pages/observatorio.html" class="hd-nav-link">Observatório</a>
            </nav>

            <button class="hd-menu-toggle" aria-label="Abrir menu mobile">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>

            <div class="hd-user-wrap" id="hdUserWrap">
                <button class="hd-avatar" id="btnUserMenu" aria-label="Menu do usuário" aria-expanded="false">
                    <span id="userInitials">CB</span>
                </button>
                <div class="hd-dropdown" id="userDropdown" role="menu">
                    <div class="hd-dd-profile">
                        <div class="hd-dd-avatar"><span id="userInitialsLarge">CB</span></div>
                        <div class="hd-dd-info">
                            <strong id="userName">…</strong>
                            <span id="userEmail">…</span>
                        </div>
                    </div>
                    <div class="hd-dd-divider"></div>
                    <a href="./pages/home.html"        class="hd-dd-item" role="menuitem">Início</a>
                    <a href="index.html"    class="hd-dd-item" role="menuitem">Mapa Interativo</a>
                    <a href="./pages/eventos.html"     class="hd-dd-item" role="menuitem">Agenda de Eventos</a>
                    <a href="./pages/observatorio.html" class="hd-dd-item" role="menuitem">Observatório</a>
                    <a href="./pages/panel.html"       class="hd-dd-item" id="menuAdminPanel" style="display:none" role="menuitem">Painel Admin</a>
                    <div class="hd-dd-divider"></div>
                    <a href="#" class="hd-dd-item hd-dd-danger" id="btnLogout" role="menuitem">Sair</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Container Principal -->
    <div class="map-wrapper">
        <!-- Sidebar -->
        <aside class="map-sidebar active" id="sidebar">
            <button class="sidebar-toggle-btn" id="btnToggleMenu" type="button" aria-label="Recolher painel lateral">
                <span>‹</span>
            </button>
            <div class="sidebar-content">
                <!-- Estatísticas Rápidas -->
                <div class="quick-stats">
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10 0C7.2 0 5 2.2 5 5c0 3.9 5 15 5 15s5-11.1 5-15c0-2.8-2.2-5-5-5zm0 7.5c-1.4 0-2.5-1.1-2.5-2.5S8.6 2.5 10 2.5s2.5 1.1 2.5 2.5S11.4 7.5 10 7.5z"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalPlaces">0</span>
                            <span class="stat-label">Lugares</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                                <rect x="3" y="3" width="5" height="5" rx="1"/>
                                <rect x="3" y="12" width="5" height="5" rx="1"/>
                                <rect x="12" y="3" width="5" height="5" rx="1"/>
                                <rect x="12" y="12" width="5" height="5" rx="1"/>
                            </svg>
                        </div>
                        <div class="stat-info">
                            <span class="stat-value" id="totalCategories">0</span>
                            <span class="stat-label">Categorias</span>
                        </div>
                    </div>
                </div>

                <!-- Busca -->
                <div class="search-section">
                    <div class="search-box">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none">
                            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                        <input 
                            type="text" 
                            id="searchInput" 
                            class="search-input" 
                            placeholder="Buscar lugares..."
                            autocomplete="off"
                        >
                        <button class="search-clear" id="btnClearSearch" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Filtros de Categorias -->
                <div class="filters-section">
                    <div class="filters-header">
                        <h3>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <path d="M1 2H15L10 8V13L6 15V8L1 2Z"/>
                            </svg>
                            Categorias
                        </h3>
                        <button class="btn-clear-filters" id="btnClearFilters">
                            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                <path d="M11 3L3 11M3 3L11 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                            </svg>
                        </button>
                    </div>
                    <div class="filter-buttons" id="filterButtons">
                        <!-- Categorias serão carregadas dinamicamente aqui -->
                    </div>
                </div>

                <!-- Lista de Resultados -->
                <div class="results-section">
                    <div class="results-header">
                        <h3>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                                <rect x="2" y="3" width="12" height="2" rx="1"/>
                                <rect x="2" y="7" width="12" height="2" rx="1"/>
                                <rect x="2" y="11" width="8" height="2" rx="1"/>
                            </svg>
                            Lugares
                        </h3>
                        <div class="sort-select-wrap">
                            <select id="sortSelect" class="sort-select" aria-label="Ordenar lugares">
                                <option value="nome">Nome (A-Z)</option>
                                <option value="categoria">Categoria</option>
                                <option value="distancia">Mais perto</option>
                            </select>
                            <svg class="sort-select-icon" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </div>
                    </div>
                    <div class="results-list" id="resultsList">
                        <!-- Cartões de lugares carregados dinamicamente aqui -->
                    </div>
                </div>

                <!-- Contador de Resultados -->
                <div class="results-summary">
                    <div class="results-count" id="resultsCount">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0C5.2 0 3 2.2 3 5c0 3.9 5 11 5 11s5-7.1 5-11c0-2.8-2.2-5-5-5zm0 7.5c-1.4 0-2.5-1.1-2.5-2.5S6.6 2.5 8 2.5s2.5 1.1 2.5 2.5S9.4 7.5 8 7.5z"/>
                        </svg>
                        <span>Carregando...</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Mapa -->
        <div class="map-container">
            <div id="map"></div>
            
            <!-- Map Controls -->
            <div class="map-controls">
                <button class="map-control-btn" id="btnMyLocation" title="Minha localização">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 2V5M10 15V18M18 10H15M5 10H2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
                <button class="map-control-btn" id="btnRecenter" title="Recentrar mapa">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 3C6.1 3 3 6.1 3 10C3 13.9 6.1 17 10 17C13.9 17 17 13.9 17 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M17 6V10H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

            <!-- Legenda de Categorias -->
            <div class="map-legend" id="mapLegend">
                <button class="legend-toggle" id="btnLegendToggle" type="button" aria-expanded="false" aria-controls="legendContent">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M1 2H15L10 8V13L6 15V8L1 2Z"/></svg>
                    <span>Legenda</span>
                    <svg class="legend-chevron" width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="legend-content" id="legendContent" hidden>
                    <!-- Itens da legenda carregados dinamicamente aqui -->
                </div>
            </div>
        </div>
    </div>

    <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
    </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Config Firebase -->
    <script src="js/firebase-config.js"></script>

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Script do Mapa -->
    <script src="js/map.js"></script>
</body>
</html>
